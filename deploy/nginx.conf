events {
    worker_connections 1024;
}

http {
    client_max_body_size 20m;  # legal PDFs/case law uploads can be sizeable

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;

        # Frontend build sends API calls to /api/* (baked in at build time via
        # NEXT_PUBLIC_API_BASE_URL=/api) - strip the prefix and forward to the
        # backend container, which knows nothing about that prefix.
        location /api/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Default 60s is too short for PDF ingestion (text extraction +
            # per-chunk embedding, CPU-bound, on a throttled single-vCPU
            # free-tier host) and for "hard" queries that run multi-query
            # retrieval + two reranking passes before the LLM call even
            # starts - both routinely exceed 60s here, not just on huge inputs.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
